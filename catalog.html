<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — АманатСтрой</title>
<meta name="description" content="Каталог: OSB, фанера, ламинат, гипсокартон, шпаклёвки, профили, МДФ. Цены в сомах.">
<meta name="theme-color" content="#D4500A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23D4500A'/%3E%3Cpath d='M8 22V10h5l3 7 3-7h5v12' stroke='%23fff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="index.css">
</head>
<body>
<header id="hd"></header>

<main>
<section style="padding-top:48px">
  <div class="wrap">
    <h2>Каталог материалов</h2>
    <p class="sub">Цены указаны «от». Добавляйте позиции в заявку и отправляйте одним сообщением.</p>
    <div class="tb">
      <input id="q" type="search" placeholder="Поиск: например, ламинат, OSB, шпаклёвка" aria-label="Поиск по каталогу">
      <select id="so" aria-label="Сортировка"><option value="">По умолчанию</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="cnt" id="rc" aria-live="polite"></div>
    <div class="grid" id="pg"></div>
  </div>
</section>
</main>

<footer id="ft"></footer>
<script src="app.js"></script>
</body>
</html>
